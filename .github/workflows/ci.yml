name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Itch HTML5 zip
        run: npm run build:itch
        env:
          VITE_BASE: ./
      - uses: actions/upload-artifact@v4
        with:
          name: thread-itch
          path: thread-itch.zip
